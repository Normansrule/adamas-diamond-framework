name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ngspice iverilog yosys
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm ci --silent
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: make spice rtl synth layout place
      - run: cd tools && python build_refs.py && python check_citations.py
      - run: python examples/make_all_figures.py
