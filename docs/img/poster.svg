<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica,Arial,sans-serif">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1320"/><stop offset="1" stop-color="#12344a"/></linearGradient></defs>
<rect width="1400" height="1000" fill="#f4f7f9"/><rect width="1400" height="110" fill="url(#g)"/>
<text x="30" y="62" font-size="46" font-weight="800" fill="#fff" letter-spacing="5">ADAMAS</text>
<text x="290" y="60" font-size="20" fill="#9fe8f2">Diamond wafers for classical and quantum circuits: the framework on one page</text>
<text x="290" y="88" font-size="14" fill="#c8d6e0">Sixteen numbers, each from a cited equation or measurement. Teal = advantage, red = obstacle, gold = status.</text>
<g><rect x="30" y="130" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="48" y="160" font-size="15" font-weight="700" fill="#1d2733">Same crystal, tighter bonds</text>
<text x="48" y="212" font-size="44" font-weight="800" fill="#0fa3b1">3.567 Å</text>
<text x="48" y="238" font-size="13.5" fill="#4a5a6a">lattice constant vs silicon 5.431 Å; bandgap 5.47 vs 1.12 eV</text>
<text x="48" y="268" font-size="10.5" fill="#8a97a3">[sze2006] [wort2008]</text></g><g><rect x="370" y="130" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="388" y="160" font-size="15" font-weight="700" fill="#1d2733">Power-switch scorecard</text>
<text x="388" y="212" font-size="44" font-weight="800" fill="#0fa3b1">48,976×</text>
<text x="388" y="238" font-size="13.5" fill="#4a5a6a">Baliga figure of merit relative to silicon (holes)</text>
<text x="388" y="268" font-size="10.5" fill="#8a97a3">[baliga1982]</text></g><g><rect x="710" y="130" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="728" y="160" font-size="15" font-weight="700" fill="#1d2733">Heat removal</text>
<text x="728" y="212" font-size="44" font-weight="800" fill="#0fa3b1">15×</text>
<text x="728" y="238" font-size="13.5" fill="#4a5a6a">thermal conductivity, 22.0 vs 1.5 W/(cm·K)</text>
<text x="728" y="268" font-size="10.5" fill="#8a97a3">[wei1993]</text></g><g><rect x="1050" y="130" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="1068" y="160" font-size="15" font-weight="700" fill="#1d2733">Wafers today</text>
<text x="1068" y="212" font-size="44" font-weight="800" fill="#f4a261">76 mm</text>
<text x="1068" y="238" font-size="13.5" fill="#4a5a6a">reproducible single crystal; silicon uses 300 mm</text>
<text x="1068" y="268" font-size="10.5" fill="#8a97a3">[e6orbray2026]</text></g><g><rect x="30" y="300" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="48" y="330" font-size="15" font-weight="700" fill="#1d2733">Real diamond switch</text>
<text x="48" y="382" font-size="44" font-weight="800" fill="#0fa3b1">89×</text>
<text x="48" y="408" font-size="13.5" fill="#4a5a6a">better than silicon's theoretical limit (2568 V, 7.54 mΩ·cm²)</text>
<text x="48" y="438" font-size="10.5" fill="#8a97a3">[saha2022]</text></g><g><rect x="370" y="300" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="388" y="330" font-size="15" font-weight="700" fill="#1d2733">Traction inverter, ideal</text>
<text x="388" y="382" font-size="44" font-weight="800" fill="#0fa3b1">8×</text>
<text x="388" y="408" font-size="13.5" fill="#4a5a6a">less switch loss than ideal silicon carbide</text>
<text x="388" y="438" font-size="10.5" fill="#8a97a3">[erickson2020] chapter E9</text></g><g><rect x="710" y="300" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="728" y="330" font-size="15" font-weight="700" fill="#1d2733">Dopant activation, 300 K</text>
<text x="728" y="382" font-size="44" font-weight="800" fill="#e63946">0.6%</text>
<text x="728" y="408" font-size="13.5" fill="#4a5a6a">of boron atoms active in diamond (90% in silicon)</text>
<text x="728" y="438" font-size="10.5" fill="#8a97a3">[lagrange1998]</text></g><g><rect x="1050" y="300" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="1068" y="330" font-size="15" font-weight="700" fill="#1d2733">Logic today</text>
<text x="1068" y="382" font-size="44" font-weight="800" fill="#f4a261">p-only</text>
<text x="1068" y="408" font-size="13.5" fill="#4a5a6a">first n-channel MOSFET 2024; DIA-4 processor placed in about 1 mm²</text>
<text x="1068" y="438" font-size="10.5" fill="#8a97a3">[liao2024] [liu2017]</text></g><g><rect x="30" y="470" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="48" y="500" font-size="15" font-weight="700" fill="#1d2733">Qubit at room temperature</text>
<text x="48" y="552" font-size="44" font-weight="800" fill="#0fa3b1">1.8 ms</text>
<text x="48" y="578" font-size="13.5" fill="#4a5a6a">electron coherence, ¹²C diamond; nuclear memory &gt; 1 s</text>
<text x="48" y="608" font-size="10.5" fill="#8a97a3">[balasubramanian2009] [maurer2012]</text></g><g><rect x="370" y="470" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="388" y="500" font-size="15" font-weight="700" fill="#1d2733">Two qubits entangled</text>
<text x="388" y="552" font-size="44" font-weight="800" fill="#0fa3b1">25 nm</text>
<text x="388" y="578" font-size="13.5" fill="#4a5a6a">apart, fidelity 0.67; coherence would allow 0.998</text>
<text x="388" y="608" font-size="10.5" fill="#8a97a3">[dolde2013] chapter E5</text></g><g><rect x="710" y="470" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="728" y="500" font-size="15" font-weight="700" fill="#1d2733">The real bottleneck</text>
<text x="728" y="552" font-size="44" font-weight="800" fill="#e63946">q ≈ 0.75</text>
<text x="728" y="578" font-size="13.5" fill="#4a5a6a">charge-state preparation, not coherence</text>
<text x="728" y="608" font-size="10.5" fill="#8a97a3">[aslam2013] chapter E5</text></g><g><rect x="1050" y="470" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="1068" y="500" font-size="15" font-weight="700" fill="#1d2733">Link error to scale</text>
<text x="1068" y="552" font-size="44" font-weight="800" fill="#f4a261">&lt; 1.3%</text>
<text x="1068" y="578" font-size="13.5" fill="#4a5a6a">per inter-cell gate for the surface code to help</text>
<text x="1068" y="608" font-size="10.5" fill="#8a97a3">[fowler2012] chapter E6</text></g><g><rect x="30" y="640" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="48" y="670" font-size="15" font-weight="700" fill="#1d2733">Machine area</text>
<text x="48" y="722" font-size="44" font-weight="800" fill="#0fa3b1">3 mm</text>
<text x="48" y="748" font-size="13.5" fill="#4a5a6a">die side for 20 million qubits at 1 µm pitch</text>
<text x="48" y="778" font-size="10.5" fill="#8a97a3">chapter E10</text></g><g><rect x="370" y="640" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="388" y="670" font-size="15" font-weight="700" fill="#1d2733">Machine time</text>
<text x="388" y="722" font-size="44" font-weight="800" fill="#e63946">0.9 yr</text>
<text x="388" y="748" font-size="13.5" fill="#4a5a6a">to factor RSA-2048 at a 1 ms cycle (8 h superconducting)</text>
<text x="388" y="778" font-size="10.5" fill="#8a97a3">[gidney2021] chapter E10</text></g><g><rect x="710" y="640" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="728" y="670" font-size="15" font-weight="700" fill="#1d2733">First products</text>
<text x="728" y="722" font-size="44" font-weight="800" fill="#0fa3b1">sensors</text>
<text x="728" y="748" font-size="13.5" fill="#4a5a6a">quantum magnetometers, detectors, heat spreaders ship now</text>
<text x="728" y="778" font-size="10.5" fill="#8a97a3">chapter E11</text></g><g><rect x="1050" y="640" width="320" height="150" rx="14" fill="#fff" stroke="#dde3e8"/>
<text x="1068" y="670" font-size="15" font-weight="700" fill="#1d2733">Evidence base</text>
<text x="1068" y="722" font-size="44" font-weight="800" fill="#f4a261">524 refs</text>
<text x="1068" y="748" font-size="13.5" fill="#4a5a6a">each equation and figure carries a citation key</text>
<text x="1068" y="778" font-size="10.5" fill="#8a97a3">references/REFERENCES.md</text></g>
<text x="30" y="820" font-size="16" font-weight="700" fill="#1d2733">The path this repository follows, in order</text><rect x="30" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="105" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Grow wafer</text><path d="M182 858 L196 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M192 852 L200 858 L192 864 Z" fill="#0fa3b1"/><rect x="198" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="273" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Pattern</text><path d="M350 858 L364 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M360 852 L368 858 L360 864 Z" fill="#0fa3b1"/><rect x="366" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="441" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Process</text><path d="M518 858 L532 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M528 852 L536 858 L528 864 Z" fill="#0fa3b1"/><rect x="534" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="609" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Analog &amp; power</text><path d="M686 858 L700 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M696 852 L704 858 L696 864 Z" fill="#0fa3b1"/><rect x="702" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="777" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Digital</text><path d="M854 858 L868 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M864 852 L872 858 L864 864 Z" fill="#0fa3b1"/><rect x="870" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="945" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">NV qubits</text><path d="M1022 858 L1036 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M1032 852 L1040 858 L1032 864 Z" fill="#0fa3b1"/><rect x="1038" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="1113" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Error correction</text><path d="M1190 858 L1204 858" stroke="#0fa3b1" stroke-width="2.5"/><path d="M1200 852 L1208 858 L1200 864 Z" fill="#0fa3b1"/><rect x="1206" y="835" width="150" height="46" rx="10" fill="#15405a" stroke="#0fa3b1"/><text x="1281" y="864" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Applications</text>
<text x="30" y="930" font-size="13" fill="#4a5a6a">Generated by adamas.poster from the package's own models. Bracketed keys resolve in references/REFERENCES.md; "chapter" points into docs/expert/.</text>
<text x="30" y="955" font-size="13" fill="#4a5a6a">Room-temperature diamond quantum machines will be memory-rich and slow: their case is embedded, sensing-coupled, and networked computing, not factoring.</text>
</svg>