<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="ADAMAS: a framework for diamond-wafer electronics, from crystal growth to room-temperature quantum processors">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#12344a"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ff0ff"/>
      <stop offset="1" stop-color="#0fa3b1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d5e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <!-- lattice motif -->
  <g stroke="#2d5d78" stroke-width="1.2" fill="#2d5d78" opacity="0.7">
    <path d="M820 60 L880 100 L940 60 M880 100 L880 160 M880 160 L820 200 M880 160 L940 200 M940 60 L1000 100 L1060 60 M1000 100 L1000 160 L940 200 M1000 160 L1060 200 M1060 60 L1120 100 L1120 160 L1060 200 M820 200 L820 260 L880 300 L940 260 L940 200 M940 260 L1000 300 L1060 260 L1060 200 M1060 260 L1120 300" fill="none"/>
    <circle cx="820" cy="60" r="5"/><circle cx="880" cy="100" r="5"/><circle cx="940" cy="60" r="5"/>
    <circle cx="880" cy="160" r="5"/><circle cx="820" cy="200" r="5"/><circle cx="940" cy="200" r="5"/>
    <circle cx="1000" cy="100" r="5"/><circle cx="1060" cy="60" r="5"/><circle cx="1060" cy="200" r="5"/>
    <circle cx="1120" cy="100" r="5"/><circle cx="1120" cy="160" r="5"/><circle cx="820" cy="260" r="5"/>
    <circle cx="880" cy="300" r="5"/><circle cx="940" cy="260" r="5"/><circle cx="1000" cy="300" r="5"/>
    <circle cx="1060" cy="260" r="5"/><circle cx="1120" cy="300" r="5"/>
  </g>
  <!-- the NV center: nitrogen (red) next to a vacancy (dashed) -->
  <circle cx="1000" cy="160" r="46" fill="url(#glow)"/>
  <circle cx="1000" cy="160" r="9" fill="#ff4d5e" stroke="#fff" stroke-width="1.5"/>
  <text x="1000" y="164.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">N</text>
  <circle cx="1000" cy="100" r="9" fill="#0b1320" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 2.5"/>
  <text x="1000" y="104.5" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">V</text>
  <path d="M1000 140 L1000 118" stroke="#ffd166" stroke-width="2.5"/>
  <path d="M994 122 L1000 110 L1006 122 Z" fill="#ffd166"/>

  <!-- gem -->
  <g transform="translate(70,70)">
    <path d="M40 0 L160 0 L200 50 L100 170 L0 50 Z" fill="url(#gem)" opacity="0.95"/>
    <path d="M40 0 L70 50 L100 0 L130 50 L160 0 M0 50 L200 50 M70 50 L100 170 L130 50" stroke="#e9fdff" stroke-width="1.6" fill="none" opacity="0.8"/>
  </g>

  <text x="300" y="150" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="6">ADAMAS</text>
  <text x="304" y="196" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#9fe8f2">A scientific framework for diamond-wafer electronics</text>
  <text x="304" y="230" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#c8d6e0">from crystal growth to transistors to room-temperature quantum processors</text>

  <!-- pipeline -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g fill="#15405a" stroke="#3aa7bd" stroke-width="1.5">
      <rect x="70" y="300" width="180" height="64" rx="12"/>
      <rect x="290" y="300" width="180" height="64" rx="12"/>
      <rect x="510" y="300" width="180" height="64" rx="12"/>
      <rect x="730" y="300" width="180" height="64" rx="12"/>
      <rect x="950" y="300" width="180" height="64" rx="12" stroke="#ff4d5e"/>
    </g>
    <g fill="#ffffff">
      <text x="160" y="328">1. Grow the wafer</text>
      <text x="380" y="328">2. Process it</text>
      <text x="600" y="328">3. Analog and power</text>
      <text x="820" y="328">4. Digital logic</text>
      <text x="1040" y="328">5. Quantum</text>
    </g>
    <g fill="#9fb8c6" font-size="12" font-weight="400">
      <text x="160" y="349">from methane plasma</text>
      <text x="380" y="349">dope, etch, contact</text>
      <text x="600" y="349">kilovolt switches, radio</text>
      <text x="820" y="349">logic that runs at 300 °C</text>
      <text x="1040" y="349">NV qubits, no refrigerator</text>
    </g>
    <g stroke="#3aa7bd" stroke-width="2.5" fill="#3aa7bd">
      <path d="M254 332 L282 332"/><path d="M474 332 L502 332"/><path d="M694 332 L722 332"/><path d="M914 332 L942 332"/>
      <path d="M280 326 L290 332 L280 338 Z"/><path d="M500 326 L510 332 L500 338 Z"/><path d="M720 326 L730 332 L720 338 Z"/><path d="M940 326 L950 332 L940 338 Z"/>
    </g>
  </g>
  <text x="1130" y="400" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6f8797" text-anchor="end">470 references · every equation and figure carries a citation key</text>
</svg>
